# The demo shop: six services, one image, one script (services/app.py, mounted from the
# ConfigMap that deploy.sh creates). Every service answers JSON and checks its dependencies.
#
#   storefront -> catalog, cart, checkout
#   checkout   -> orders-db, payments
#
# Memory limits are deliberately modest so the "oom" incident is quick.
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: storefront, namespace: shop, labels: { app: storefront, tier: web } }
spec:
  replicas: 2
  selector: { matchLabels: { app: storefront } }
  template:
    metadata: { labels: { app: storefront, tier: web } }
    spec:
      containers:
        - name: storefront
          image: python:3.12-slim
          command: ["python3", "-u", "/app/app.py"]
          env:
            - { name: SERVICE_NAME, value: storefront }
            - { name: DEPENDS_ON, value: "catalog=http://catalog:8080/healthz,cart=http://cart:8080/healthz,checkout=http://checkout:8080/healthz" }
          ports: [{ containerPort: 8080 }]
          readinessProbe: { httpGet: { path: /healthz, port: 8080 }, periodSeconds: 5, failureThreshold: 2 }
          resources: { requests: { cpu: 20m, memory: 48Mi }, limits: { memory: 128Mi } }
          volumeMounts: [{ name: app, mountPath: /app }]
      volumes: [{ name: app, configMap: { name: app-code } }]
---
apiVersion: v1
kind: Service
metadata: { name: storefront, namespace: shop }
spec: { selector: { app: storefront }, ports: [{ port: 80, targetPort: 8080 }] }
---
